services:
  backend:
    image: evenve/handleliste-backend:latest
    restart: unless-stopped
    volumes:
      - db-data:/data
    networks:
      - internal

  frontend:
    image: evenve/handleliste-frontend:latest
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"
    networks:
      - internal

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      - internal

volumes:
  db-data:

networks:
  internal:
